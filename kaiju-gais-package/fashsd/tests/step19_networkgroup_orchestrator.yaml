topology:
  mode: single-node
services: []
network_groups:
  - owner: "kaiju-test-orch-owner"
    dependents: ["kaiju-test-orch-dep"]
    compose_dir: /tmp/kaiju-orch-networkgroup-test
    verify_via: "kaiju-test-orch-dep"
drives: []
watchdog:
  interval_minutes: 60
  clock_drift_threshold_ms: 2000
alerting:
  ntfy_topic: "kaiju-alerts"
  ntfy_self_hosted_url: "http://192.0.2.45:8201"
