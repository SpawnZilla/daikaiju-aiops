# kaiju_fashsd_config.example.yaml
# Example/template Kaiju Spine FASHSD config.
# Real installs live at /etc/kaiju-spine/services.yaml (written by the
# bootstrap installer's Phase 5, or hand-edited to add/remove resources).
#
# Schema v1.1 (2026-07-22) — added compose_dir per service, required by
# fix scripts (e.g. FM-01) that need to validate a compose directory
# argument without a hardcoded allowlist.
# Schema v1.2 (2026-07-29) — added network_groups, required by FM-03-
# style fixes for restarting a VPN/network-namespace owner + dependents
# in the correct order.
# Schema v1.3 (2026-09-06) — added expected_subdirs per drive (FM-06
# ghost-mount recovery) and dns_check_url per service (FM-07 DNS/
# outbound-connectivity recovery). Both approved 2026-07-24,
# never actually added to this file until now.
# Schema v1.4 (2026-09-13) — added optional insecure_tls per service
# (app_curl_check.sh passes curl -k when true, for self-signed-cert
# services like Omada). health_url is now explicitly OPTIONAL: omit it
# (or set null) for services with no HTTP health endpoint at all (e.g.
# Watchtower) -- app_curl_check.sh SKIPs these instead of failing them.
# Both changes fix real gaps found 2026-09-12 blocking Omada/Scanopy/
# Watchtower/Portainer-agent app-level FASHSD coverage.
# Schema v1.5 (2026-09-15) — added optional `service:` per service
# (generalized from an earlier incident). Compose's container name
# and its Compose SERVICE name are not guaranteed to match -- Compose
# auto-generates a container name whenever a service has no explicit
# container_name: override, and fm01_container_exited.sh's `docker
# compose up -d <arg>` needs the SERVICE name, not the container name,
# to actually work. Omit `service:` entirely for the common case where
# they're the same string (every existing example below still works
# unchanged) -- only set it when they genuinely differ, e.g. a compose
# file defining `server:` with no container_name: override, which
# Compose then names `<project>-server-1`.

topology:
  mode: single-node          # single-node | two-node-wol
  # Only present/read if mode is two-node-wol:
  watcher_node:
    name: "watcher"
    ip: "192.0.2.21"
  target_node:
    name: "primary"
    ip: "192.0.2.45"
    mac: "AA:BB:CC:Kaidosho:EE:FF"   # required for WoL, ignored in single-node mode

services:
  - name: "jellyfin"
    container: "jellyfin"
    compose_dir: "/opt/kaiju-spine/compose/jellyfin"
    health_url: "http://localhost:8096/health"
    expected_code: "200"
    timeout_seconds: 10
  - name: "vaultwarden"
    container: "vaultwarden"
    compose_dir: "/opt/kaiju-spine/compose/vaultwarden"
    health_url: "http://localhost:8090/api/config"
    expected_code: "200"
  - name: "omada-controller"    # example: self-signed cert -> insecure_tls
    container: "omada-controller"
    compose_dir: "/opt/kaiju-spine/compose/omada"
    health_url: "https://localhost:8043/"
    expected_code: "200"
    timeout_seconds: 10
    insecure_tls: true
  - name: "watchtower"    # example: no HTTP endpoint -> health_url omitted, SKIPped by app_curl_check.sh
    container: "watchtower"
    compose_dir: "/opt/kaiju-spine/compose/watchtower"
    timeout_seconds: 10
  - name: "scanopy"    # example: container name != compose service name (schema v1.5)
    container: "scanopy-server-1"    # real Docker container name, auto-generated by Compose
    service: "server"    # real Compose service name (from the compose file's `server:` block) -- REQUIRED here since it differs from container:
    compose_dir: "/opt/kaiju-spine/compose/scanopy"
    health_url: "http://localhost:8384/"
    expected_code: "200"
    timeout_seconds: 10
  - name: "prowlarr"
    container: "prowlarr"
    compose_dir: "/mnt/hola2/compose/arr"
    health_url: "http://localhost:9696/ping"
    expected_code: "200"
    timeout_seconds: 10
    dns_check_url: "https://nyaa.si"   # optional, schema v1.3 — FM-07 outbound-connectivity check, separate from health_url
  # Add one entry per watched service. Every field is required except
  # dns_check_url (optional, only needed if FM-07-style DNS/outbound
  # recovery applies to that service) — the bootstrap installer's
  # Phase 5 prompts for all required fields per service when FASHSD is
  # enabled interactively.

network_groups:
  # Added schema v1.2 (2026-07-29), for FM-03-style fixes where restarting
  # one "owner" container (e.g. a VPN gateway) requires restarting a set
  # of dependent containers sharing its network namespace, in order:
  # owner first, verify healthy, THEN dependents. Never restart dependents
  # independently of a healthy owner (see /FM-13 postmortem).
  - owner: "gluetun"
    dependents: ["radarr", "sonarr", "lidarr", "qbittorrent", "prowlarr"]
    compose_dir: "/mnt/hola2/compose/arr"
    verify_via: "qbittorrent"   # container to check outbound connectivity from, post-restart
  # Add one entry per network-namespace-sharing group. Every field is
  # required. verify_via should typically be one of the dependents.

drives:
  - name: "data1"
    mount_point: "/mnt/data1"
    device: "/dev/sda"
    smart_check: true
    expected_subdirs: []   # optional, schema v1.3 — FM-06 ghost-mount recovery check; leave empty if not applicable
  # Add one entry per monitored drive. expected_subdirs is optional —
  # only needed for drives where FM-06-style ghost-mount recovery
  # applies (verifies specific subdirectories exist post-remount, not
  # just that mountpoint(1) succeeds).

alerting:
  ntfy_topic: "kaiju-alerts"
  ntfy_self_hosted_url: ""     # empty = use public ntfy.sh relay

watchdog:
  interval_minutes: 60         # conservative default; Kaidosho's own install runs 30
