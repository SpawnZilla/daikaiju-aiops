# production_signatures.conf --  (2026-09-19). Format: see the
# docstring of production_matcher.py. Shared with the future
# snapshot hook (a separate sibling hook).
#
# TARGET 1: mcp-a2a-gateway. Prod port is 10000 (DD_Services_Index.md) --
# NOT 10001, which is the Bakaidah A2A Agent-Server. Paths confirmed by
# listing /srv/angkai on 2026-09-19; the unit name comes from the
#  deployment notes. Re-check `systemctl cat mcp-a2a-gateway.service`
# before relying on the unit-file paths.
#
# UPDATED 2026-09-26 ( Layer C P3): production gateway CODE moved to
# /opt/kaiju-gateway (kaibroker-owned, angkai write DENIED at the OS level).
# The old /srv/angkai/mcp-a2a-gateway copy is no longer what production
# runs; it stays listed until it is retired, so an edit there is still gated
# and nobody mistakes it for a free-to-edit copy.
path|/opt/kaiju-gateway|mcp-a2a-gateway code (production, since 2026-09-26)
path|/srv/angkai/mcp-a2a-gateway|mcp-a2a-gateway code (pre-P3 copy, pending retirement)
path|/srv/angkai/a2a_gateway_data|mcp-a2a-gateway data
path|/etc/systemd/system/mcp-a2a-gateway.service|mcp-a2a-gateway unit file
path|/etc/systemd/system/mcp-a2a-gateway.service.d|mcp-a2a-gateway unit drop-ins
unit|mcp-a2a-gateway.service|mcp-a2a-gateway systemd unit
port|10000|mcp-a2a-gateway prod port
#
# The sandbox twin (mcp-a2a-gateway-sandbox, port 10099,
# /srv/angkai/a2a_gateway_sandbox_data) is deliberately NOT listed:
# it is where a change gets proven, so it must stay ungated.
#
# GUARDRAIL SELF-PROTECTION -- RESOLVED 2026-09-26 at the OS level instead of
# a denypath line: the hooks dir is root:kaiju-agents 3775 (setgid+sticky) and
# every hook .py/.sh/.js/.conf (this file included) is root-owned, so angkai
# cannot edit, replace or delete them regardless of any hook. Hook deploys
# go through the operator's shell. The denypath option below stays unused.
# denypath|/srv/angkai/.claude/hooks|guardrail hook directory (self-protection)
#
# Other production services (bakaidah-a2a, ollama-tool-proxy, ...) are not
# listed yet -- 's pre-flight item to choose further targets is open.
option|block_unverifiable|no
